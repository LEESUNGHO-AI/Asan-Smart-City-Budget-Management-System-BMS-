name: Notion → BMS 대시보드 자동 동기화

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: Notion 데이터 수집 및 data.json 생성
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, sys
          import urllib.request
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          NOW = datetime.now(KST)

          API_KEY = os.environ.get("NOTION_API_KEY", "")
          DB_ID = "54bfedc3769e43e8bdbcd59f22008417"
          BASE = "https://api.notion.com/v1"

          if not API_KEY:
              print("ERROR: NOTION_API_KEY not set")
              sys.exit(1)

          print("=" * 55)
          print("  아산시 BMS — Notion → data.json 동기화")
          print(f"  실행: {NOW.strftime('%Y-%m-%d %H:%M:%S KST')}")
          print("=" * 55)

          def notion_post(url, payload=None):
              data = json.dumps(payload or {}).encode("utf-8")
              req = urllib.request.Request(url, data=data, method="POST")
              req.add_header("Authorization", f"Bearer {API_KEY}")
              req.add_header("Notion-Version", "2022-06-28")
              req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except Exception as e:
                  print(f"  API 오류: {e}")
                  return None

          def get_title(page):
              for key, val in page.get("properties", {}).items():
                  if val.get("type") == "title":
                      arr = val.get("title", [])
                      return "".join(t.get("plain_text", "") for t in arr).strip()
              return ""

          def get_number(page, prop):
              p = page.get("properties", {}).get(prop, {})
              if p.get("type") == "number":
                  return p.get("number") or 0
              return 0

          def get_select(page, prop):
              p = page.get("properties", {}).get(prop, {})
              if p.get("type") == "select" and p.get("select"):
                  return p["select"].get("name", "")
              return ""

          def get_text(page, prop):
              p = page.get("properties", {}).get(prop, {})
              if p.get("type") == "rich_text":
                  return "".join(t.get("plain_text", "") for t in p.get("rich_text", [])).strip()
              return ""

          # ── Notion DB 전체 쿼리 (페이지네이션) ──
          all_pages = []
          has_more = True
          start_cursor = None
          while has_more:
              payload = {"page_size": 100}
              if start_cursor:
                  payload["start_cursor"] = start_cursor
              result = notion_post(f"{BASE}/databases/{DB_ID}/query", payload)
              if not result:
                  print("ERROR: Notion query failed")
                  sys.exit(1)
              all_pages.extend(result.get("results", []))
              has_more = result.get("has_more", False)
              start_cursor = result.get("next_cursor")

          print(f"  Notion에서 총 {len(all_pages)}개 행 로드")

          # ── 소계/합계 행 필터링 ──
          SUMMARY_KEYWORDS = [
              "총 계", "총계", "소 계", "소계",
              "0. 사용현황 총괄", "사용현황 총괄",
              "사용현황총괄"
          ]

          BIMOK_CODE_RE = re.compile(r"^(인건비|운영비|여비|연구개발비|유형자산|무형자산|건설비|사업비\s*배분)\s*\(\d{2,3}\)$")
          BIMOK_SIMPLE = ["인건비", "운영비", "여비", "사업비배분", "비목", "세목"]

          def is_summary_row(page):
              title = get_title(page)
              bimok = get_select(page, "비목")

              title_clean = title.strip()
              bimok_clean = bimok.strip()

              for kw in SUMMARY_KEYWORDS:
                  if kw in title_clean or kw in bimok_clean:
                      return True

              if BIMOK_CODE_RE.match(bimok_clean):
                  if title_clean == bimok_clean:
                      return True

              if bimok_clean in BIMOK_SIMPLE and title_clean == bimok_clean:
                  return True

              if bimok_clean == "0. 사용현황 총괄":
                  return True

              if bimok_clean == "총 계":
                  return True

              return False

          detail_items = []
          excluded = []
          for page in all_pages:
              if is_summary_row(page):
                  excluded.append(get_title(page))
                  continue

              title = get_title(page)
              if not title:
                  continue

              bimok = get_select(page, "비목")
              status = get_select(page, "상태")
              total_budget = get_number(page, "총예산")
              budget_2024 = get_number(page, "2024년예산")
              exec_2024 = get_number(page, "2024년집행")
              budget_2025 = get_number(page, "2025년예산")
              exec_2025 = get_number(page, "2025년집행")
              use_total = get_number(page, "사용금액(합계)")
              use_supply = get_number(page, "사용금액(공급가)")
              use_vat = get_number(page, "사용금액(VAT)")
              balance = get_number(page, "잔액")
              exec_rate = get_number(page, "집행률")

              total_exec = exec_2024 + exec_2025
              if total_exec == 0 and use_total > 0:
                  total_exec = use_total

              if exec_rate == 0 and total_budget > 0 and total_exec > 0:
                  exec_rate = round(total_exec / total_budget, 4)

              if balance == 0 and total_budget > 0:
                  balance = total_budget - total_exec

              detail_items.append({
                  "항목명": title,
                  "비목": bimok,
                  "상태": status or ("정상" if exec_rate < 0.9 else ("주의" if exec_rate < 1.0 else "초과")),
                  "총예산": total_budget,
                  "2024년예산": budget_2024,
                  "2024년집행": exec_2024,
                  "2025년예산": budget_2025,
                  "2025년집행": exec_2025,
                  "사용금액합계": use_total,
                  "집행액": total_exec,
                  "잔액": balance,
                  "집행률": exec_rate
              })

          print(f"  제외된 소계/합계 행: {len(excluded)}개")
          for ex in excluded[:10]:
              print(f"    [제외] {ex}")
          print(f"  집계 대상 세부 항목: {len(detail_items)}개")

          # ── 비목별 집계 ──
          bimok_map = {}
          for item in detail_items:
              bk = item["비목"] or "기타"
              if bk not in bimok_map:
                  bimok_map[bk] = {"예산": 0, "집행": 0, "잔액": 0, "항목수": 0}
              bimok_map[bk]["예산"] += item["총예산"]
              bimok_map[bk]["집행"] += item["집행액"]
              bimok_map[bk]["잔액"] += item["잔액"]
              bimok_map[bk]["항목수"] += 1

          total_budget_sum = sum(i["총예산"] for i in detail_items)
          total_exec_sum = sum(i["집행액"] for i in detail_items)
          total_balance = sum(i["잔액"] for i in detail_items)

          TOTAL_PROJECT_BUDGET = 24000000000
          overall_rate = round(total_exec_sum / TOTAL_PROJECT_BUDGET * 100, 2) if TOTAL_PROJECT_BUDGET > 0 else 0

          status_count = {}
          for item in detail_items:
              s = item["상태"] or "미분류"
              status_count[s] = status_count.get(s, 0) + 1

          bimok_summary = []
          for bk, v in sorted(bimok_map.items(), key=lambda x: x[1]["예산"], reverse=True):
              rate = round(v["집행"] / v["예산"] * 100, 2) if v["예산"] > 0 else 0
              bimok_summary.append({
                  "비목": bk,
                  "예산": v["예산"],
                  "집행": v["집행"],
                  "잔액": v["잔액"],
                  "집행률": rate,
                  "항목수": v["항목수"]
              })

          # ── 재원별 (240억 기준 고정) ──
          source_summary = [
              {"재원": "국비", "비율": 50, "금액": 12000000000},
              {"재원": "시비", "비율": 38, "금액": 9120000000},
              {"재원": "도비", "비율": 12, "금액": 2880000000}
          ]

          # ── output ──
          output = {
              "updated_at": NOW.strftime("%Y-%m-%d %H:%M:%S KST"),
              "project": {
                  "name": "아산시 강소형 스마트시티 조성사업",
                  "total_budget": TOTAL_PROJECT_BUDGET,
                  "start_date": "2023-12-01",
                  "end_date": "2026-12-31",
                  "pmo": "제일엔지니어링"
              },
              "summary": {
                  "총사업비": TOTAL_PROJECT_BUDGET,
                  "세부항목예산합": total_budget_sum,
                  "총집행액": total_exec_sum,
                  "잔액": TOTAL_PROJECT_BUDGET - total_exec_sum,
                  "전체집행률": overall_rate,
                  "항목수": len(detail_items),
                  "상태별": status_count
              },
              "source_summary": source_summary,
              "bimok_summary": bimok_summary,
              "items": detail_items
          }

          os.makedirs("data", exist_ok=True)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          with open("data/budget.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print()
          print(f"  data.json + data/budget.json 저장 완료")
          print(f"  세부 항목: {len(detail_items)}개")
          print(f"  총집행액: {total_exec_sum:,.0f}원 ({overall_rate}%)")
          print(f"  비목 분류: {len(bimok_summary)}개")
          print(f"  업데이트: {output['updated_at']}")
          PYEOF

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/budget.json
          if git diff --staged --quiet; then
            echo "ℹ️ 변경사항 없음 - 커밋 건너뜀"
          else
            git commit -m "🔄 예산 데이터 자동 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git push
            echo "✅ GitHub Pages 데이터 업데이트 완료"
          fi
