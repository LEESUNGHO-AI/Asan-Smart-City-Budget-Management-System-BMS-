name: Notion → GitHub Pages 자동 동기화

on:
  schedule:
    - cron: '0 0,5,9 * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Notion 데이터 가져오기
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 54bfedc3769e43e8bdbcd59f22008417
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import os
          import re
          from datetime import datetime

          API_KEY = os.environ["NOTION_API_KEY"]
          DB_ID   = os.environ["NOTION_DATABASE_ID"]
          BASE    = "https://api.notion.com/v1"

          headers = {
              "Authorization": f"Bearer {API_KEY}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
          }

          def notion_request(url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req  = urllib.request.Request(url, data=data, headers=headers,
                                            method="POST" if data else "GET")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # ── DB 전체 조회 ──────────────────────────────────────────
          pages, cursor = [], None
          while True:
              body = {"page_size": 100}
              if cursor:
                  body["start_cursor"] = cursor
              res = notion_request(f"{BASE}/databases/{DB_ID}/query", body)
              pages.extend(res.get("results", []))
              if not res.get("has_more"):
                  break
              cursor = res.get("next_cursor")

          print(f"📥 Notion 전체 항목 {len(pages)}개 조회")

          # ── 속성 추출 헬퍼 ───────────────────────────────────────
          def get_title(props, key):
              v = props.get(key, {}).get("title", [])
              return v[0]["plain_text"].strip() if v else ""

          def get_number(props, key):
              return props.get(key, {}).get("number") or 0

          def get_select(props, key):
              s = props.get(key, {}).get("select")
              return s["name"] if s else ""

          def get_text(props, key):
              v = props.get(key, {}).get("rich_text", [])
              return v[0]["plain_text"].strip() if v else ""

          def get_date(props, key):
              d = props.get(key, {}).get("date")
              return d["start"] if d else ""

          # ── 소계/합계/삭제대상 판별 ─────────────────────────────
          #
          # [제외 대상]
          # ① 항목명에 "[삭제대상]" 또는 "소계행-열매핑오류" 포함
          # ② 항목명 자체가 "소 계", "합 계", "총 계" 등
          # ③ 비목이 코드 없는 단독 명칭 ("인건비", "운영비" 등 → 소계 행)
          # ④ 비목이 순수 숫자 ("3", "7", "53" 등 → 열매핑 오류)
          # ⑤ 항목명 == 비목 (예: 항목명="인건비(110)", 비목="인건비(110)" → 소계 행)
          #
          # [포함 대상 - 절대 제외하지 않음]
          # ✅ 비목이 코드 있는 정상 값: 인건비(110), 운영비(210), 여비(220),
          #    연구개발비(260), 사업비배분(320), 건설비(420), 유형자산(430), 무형자산(440)
          #    → 이 비목을 가진 실제 세부 항목들이 진짜 집계 데이터

          # 비목 자체가 소계임을 나타내는 값 (코드 없는 단독 명칭)
          SUMMARY_BIMOK_EXACT = {
              "총 계", "소 계", "합 계",
              "비목", "세목",
              "0. 사용현황 총괄",
              "인건비",    # "인건비(110)"과 다름 - 코드 없는 버전
              "운영비",    # "운영비(210)"과 다름
              "여비",      # "여비(220)"과 다름
              "사업비배분",
              "유형자산",
              "무형자산",
              "건설비",
              "연구개발비",
          }

          # 항목명에 포함 시 무조건 제외
          EXCLUDE_KEYWORDS = ["[삭제대상]", "소계행-열매핑오류", "열매핑 오류"]

          # 항목명 자체가 이 값이면 제외
          EXCLUDE_NAME_EXACT = {"소 계", "합 계", "총 계", "0. 사용현황 총괄"}

          # 순수 숫자 비목
          NUM_ONLY_RE = re.compile(r'^\d+$')

          def is_exclude_row(item_name, bimok):
              """(exclude:bool, reason:str) 반환"""
              for kw in EXCLUDE_KEYWORDS:
                  if kw in item_name:
                      return True, "삭제대상"
              if item_name in EXCLUDE_NAME_EXACT:
                  return True, "소계합계명"
              if bimok in SUMMARY_BIMOK_EXACT:
                  return True, f"소계비목"
              if bimok and NUM_ONLY_RE.match(bimok):
                  return True, "숫자비목"
              # 항목명 == 비목 이면 소계 행
              if item_name and bimok and item_name.strip() == bimok.strip():
                  return True, "항목명=비목"
              return False, ""

          # ── 데이터 변환 ──────────────────────────────────────────
          items      = []
          excluded   = []
          total_budget   = 0
          total_executed = 0

          for p in pages:
              props     = p["properties"]
              item_name = get_title(props, "항목명")
              if not item_name:
                  continue

              bimok    = get_select(props, "비목")
              semok    = get_text(props, "세목")
              budget   = get_number(props, "총예산")
              executed = get_number(props, "사용금액(합계)")
              balance  = get_number(props, "잔액")
              rate     = get_number(props, "집행률")
              status   = get_select(props, "상태")
              y2024_b  = get_number(props, "2024년예산")
              y2024_e  = get_number(props, "2024년집행")
              y2025_b  = get_number(props, "2025년예산")
              y2025_e  = get_number(props, "2025년집행")
              synced   = get_date(props, "최종동기화")

              exc, reason = is_exclude_row(item_name, bimok)
              if exc:
                  excluded.append(f"  [{reason}] {item_name} | 비목:{bimok} | 집행:{executed:,.0f}")
                  continue

              # 집행률 정규화 (소수 → %, 이미 큰 숫자 → 정상화)
              if rate and 0 < rate <= 1.0:
                  rate = round(rate * 100, 2)
              elif rate and rate > 1000:
                  rate = round(rate / 100, 2)

              items.append({
                  "id":         p["id"],
                  "항목명":     item_name,
                  "비목":       bimok,
                  "세목":       semok,
                  "총예산":     budget,
                  "사용금액":   executed,
                  "잔액":       balance,
                  "집행률":     rate,
                  "상태":       status,
                  "2024년예산": y2024_b,
                  "2024년집행": y2024_e,
                  "2025년예산": y2025_b,
                  "2025년집행": y2025_e,
                  "최종동기화": synced
              })

              total_budget   += budget
              total_executed += executed

          # 로그 출력
          print(f"\n⚠️  제외 항목 {len(excluded)}개:")
          for row in excluded:
              print(row)
          print(f"\n✅ 집계 대상 세부 항목: {len(items)}개")

          # ── 비목별 집계 ──────────────────────────────────────────
          bimok_summary = {}
          for item in items:
              b = item["비목"] or "기타"
              if b not in bimok_summary:
                  bimok_summary[b] = {"예산": 0, "집행": 0, "잔액": 0, "항목수": 0}
              bimok_summary[b]["예산"]   += item["총예산"]
              bimok_summary[b]["집행"]   += item["사용금액"]
              bimok_summary[b]["잔액"]   += item["잔액"]
              bimok_summary[b]["항목수"] += 1

          # ── 전체 집행률 (총사업비 240억 기준) ───────────────────
          FIXED_TOTAL  = 24_000_000_000
          overall_rate = round(total_executed / FIXED_TOTAL * 100, 2) if FIXED_TOTAL else 0
          balance_amt  = FIXED_TOTAL - total_executed

          # ── 상태별 카운트 ────────────────────────────────────────
          status_count = {"정상": 0, "주의": 0, "초과": 0, "미집행": 0, "기타": 0}
          for item in items:
              s = item["상태"]
              status_count[s if s in status_count else "기타"] += 1

          # ── 최종 JSON ────────────────────────────────────────────
          output = {
              "updated_at": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "data_note":  "소계·합계·삭제대상 행 제외 후 세부 항목만 집계. 총사업비 240억 고정.",
              "summary": {
                  "총사업비":   FIXED_TOTAL,
                  "DB_총예산":  total_budget,
                  "총집행액":   total_executed,
                  "총잔액":     balance_amt,
                  "전체집행률": overall_rate,
                  "항목수":     len(items),
                  "제외항목수": len(excluded),
                  "상태별":     status_count
              },
              "bimok_summary": [
                  {
                      "비목":   k,
                      "예산":   v["예산"],
                      "집행":   v["집행"],
                      "잔액":   v["잔액"],
                      "집행률": round(v["집행"] / v["예산"] * 100, 2) if v["예산"] else 0,
                      "항목수": v["항목수"]
                  }
                  for k, v in sorted(bimok_summary.items(),
                                     key=lambda x: x[1]["예산"], reverse=True)
              ],
              "items": items
          }

          os.makedirs("data", exist_ok=True)
          for path in ["data.json", "data/budget.json"]:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print(f"✅ {path} 저장 완료")

          print(f"\n📊 최종 결과:")
          print(f"   총집행액:  {total_executed:>20,.0f}원  ({overall_rate:.2f}%)")
          print(f"   총잔액:    {balance_amt:>20,.0f}원")
          print(f"   DB_총예산: {total_budget:>20,.0f}원")
          print(f"   세부항목:  {len(items)}개  /  제외: {len(excluded)}개")
          EOF

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/budget.json
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음 - 커밋 건너뜀"
          else
            git commit -m "🔄 예산 데이터 자동 업데이트 $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
            git push
            echo "✅ GitHub Pages 데이터 업데이트 완료"
          fi
