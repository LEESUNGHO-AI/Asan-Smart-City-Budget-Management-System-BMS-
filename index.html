<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아산시 강소형 스마트시티 — 예산관리 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--sf:#111827;--cd:#161d2e;--bd:#1e2d47;
  --ac:#2563eb;--ac2:#0ea5e9;--gn:#10b981;--yl:#f59e0b;--rd:#ef4444;--og:#f97316;
  --tx:#e2e8f0;--mt:#64748b;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.ct{max-width:1400px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
header{border-bottom:1px solid var(--bd);padding:20px 0;background:linear-gradient(180deg,rgba(37,99,235,.08) 0%,transparent 100%)}
.hd-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hd-label{font-size:11px;letter-spacing:.15em;color:var(--ac2);text-transform:uppercase;font-family:var(--mono)}
.hd-main{font-size:20px;font-weight:700;color:#fff}
.hd-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid}
.bg-blue{border-color:var(--ac);color:var(--ac);background:rgba(37,99,235,.1)}
.bg-green{border-color:var(--gn);color:var(--gn);background:rgba(16,185,129,.1)}
.bg-red{border-color:var(--rd);color:var(--rd);background:rgba(239,68,68,.1)}
.bg-yellow{border-color:var(--yl);color:var(--yl);background:rgba(245,158,11,.1)}

.grid{display:grid;gap:20px;margin:24px 0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}

.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.k-blue::before{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.kpi.k-green::before{background:linear-gradient(90deg,var(--gn),#34d399)}
.kpi.k-yellow::before{background:linear-gradient(90deg,var(--yl),#fbbf24)}
.kpi.k-red::before{background:linear-gradient(90deg,var(--rd),#f87171)}
.kpi-label{font-size:12px;color:var(--mt);margin-bottom:8px}
.kpi-value{font-family:var(--mono);font-size:28px;font-weight:700;color:#fff}
.kpi-sub{font-size:12px;color:var(--mt);margin-top:6px}

.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}

.bar-wrap{height:28px;background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden;position:relative;margin:12px 0}
.bar-fill{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s ease;position:relative}
.bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.2) 50%,transparent 100%);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--mt);font-family:var(--mono)}

.bimok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bimok-card{background:rgba(255,255,255,.03);border-radius:8px;padding:14px 16px;border-left:4px solid;display:flex;flex-direction:column;gap:8px}
.bimok-name{font-weight:600;font-size:14px}
.bimok-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mt)}
.bimok-row span:last-child{font-family:var(--mono);color:var(--tx)}
.bimok-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.bimok-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mt);border-bottom:1px solid var(--bd);font-family:var(--mono)}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.tbl tr:hover td{background:rgba(37,99,235,.05)}
.tbl .num{text-align:right;font-family:var(--mono)}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.st-ok{background:rgba(16,185,129,.15);color:#34d399}
.st-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.st-over{background:rgba(239,68,68,.15);color:#f87171}
.st-none{background:rgba(100,116,139,.15);color:#94a3b8}

.source-bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0}
.source-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono)}

.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.links a{padding:8px 16px;border:1px solid var(--bd);border-radius:8px;color:var(--ac2);text-decoration:none;font-size:13px;transition:all .2s}
.links a:hover{background:rgba(14,165,233,.1);border-color:var(--ac2)}

.load-wrap{text-align:center;padding:80px 20px;color:var(--mt)}
.load-txt{font-size:16px;margin-top:12px}
.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

footer{text-align:center;padding:24px;color:var(--mt);font-size:12px;border-top:1px solid var(--bd);margin-top:40px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .5s ease both}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:600px){.g4{grid-template-columns:1fr}.kpi-value{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="ct">
<div class="hd-inner">
<div>
  <div class="hd-label">Budget Management System</div>
  <div class="hd-main">아산시 강소형 스마트시티 예산관리</div>
</div>
<div class="hd-meta">
  <span class="badge bg-blue">사업기간 2023.12 – 2026.12.31</span>
  <span class="badge bg-green">PMO 제일엔지니어링</span>
  <span id="dday" class="badge bg-yellow">–</span>
</div>
</div>
</div>
</header>

<div class="ct" id="app">
<div class="load-wrap" id="loading">
  <div class="spinner"></div>
  <div class="load-txt">Notion 데이터를 불러오는 중…</div>
</div>
</div>

<footer>
<div class="ct">
  <span id="footer-time">마지막 업데이트: –</span> · 30분 자동 갱신 ·
  <a href="https://github.com/LEESUNGHO-AI/Asan-Smart-City-Budget-Management-System-BMS-/actions" target="_blank" style="color:var(--ac2);text-decoration:none">GitHub Actions</a>
</div>
</footer>

<script>
var BIMOK_COLORS = [
  '#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#f97316','#06b6d4',
  '#84cc16','#a855f7','#14b8a6','#e11d48'
];
var eok = function(n){ return (n/1e8).toFixed(1); };
var pct = function(n){ return typeof n==='number' ? (n>=1 ? (n*100).toFixed(1) : (n*100).toFixed(1)) + '%' : '0%'; };
var pctRaw = function(n){ return typeof n==='number' ? (n>=1 ? n.toFixed(1) : (n*100).toFixed(1)) : '0'; };

function statusClass(s){
  if(!s) return 'st-none';
  if(s==='정상') return 'st-ok';
  if(s==='주의') return 'st-warn';
  if(s==='초과') return 'st-over';
  return 'st-none';
}

function render(d){
  var s = d.summary;
  var dday = Math.ceil((new Date('2026-12-31') - new Date())/864e5);
  document.getElementById('dday').textContent = 'D-' + dday;

  var totalBudget = s['총사업비'] || 24000000000;
  var totalExec = s['총집행액'] || 0;
  var balance = totalBudget - totalExec;
  var rate = s['전체집행률'] || 0;

  var monthsLeft = Math.max(1, Math.ceil((new Date('2026-12-31') - new Date())/(30.44*864e5)));
  var monthlyNeed = balance > 0 ? (balance / monthsLeft / 1e8).toFixed(1) : 0;

  var html = '';

  // KPI cards
  html += '<div class="grid g4" style="animation-delay:.1s">';
  html += '<div class="kpi k-blue anim"><div class="kpi-label">총 사업비</div>';
  html += '<div class="kpi-value">' + eok(totalBudget) + '<small style="font-size:14px;color:var(--mt)">억원</small></div>';
  html += '<div class="kpi-sub">국비 50% · 도비 12% · 시비 38%</div></div>';

  html += '<div class="kpi k-green anim" style="animation-delay:.15s"><div class="kpi-label">총 집행금액</div>';
  html += '<div class="kpi-value">' + eok(totalExec) + '<small style="font-size:14px;color:var(--mt)">억원</small></div>';
  html += '<div class="kpi-sub">' + rate + '% 집행</div></div>';

  html += '<div class="kpi k-yellow anim" style="animation-delay:.2s"><div class="kpi-label">잔여 예산</div>';
  html += '<div class="kpi-value">' + eok(balance) + '<small style="font-size:14px;color:var(--mt)">억원</small></div>';
  html += '<div class="kpi-sub">월평균 ' + monthlyNeed + '억원 집행 필요</div></div>';

  html += '<div class="kpi k-red anim" style="animation-delay:.25s"><div class="kpi-label">사업 마감</div>';
  html += '<div class="kpi-value">' + dday + '<small style="font-size:14px;color:var(--mt)">일</small></div>';
  html += '<div class="kpi-sub">2026년 12월 31일 기준</div></div>';
  html += '</div>';

  // 집행률 바
  html += '<div class="card anim" style="animation-delay:.3s">';
  html += '<div class="card-title">전체 예산 집행 현황 <span style="font-size:12px;color:var(--mt);font-weight:400">총사업비 240억 기준</span></div>';
  html += '<div class="bar-labels"><span>집행률 (총사업비 대비)</span><span>' + rate + '%</span></div>';
  html += '<div class="bar-wrap"><div class="bar-fill" style="width:' + Math.min(rate,100) + '%"></div></div>';
  html += '<div class="bar-labels"><span>0억</span><span>60억</span><span>120억</span><span>180억</span><span>240억</span></div>';
  html += '</div>';

  // 재원별
  html += '<div class="card anim" style="animation-delay:.35s">';
  html += '<div class="card-title">재원별 집행 현황</div>';
  html += '<div class="source-bar">';
  html += '<div class="source-seg" style="width:50%;background:var(--ac)">국비 50%</div>';
  html += '<div class="source-seg" style="width:38%;background:var(--gn)">시비 38%</div>';
  html += '<div class="source-seg" style="width:12%;background:var(--yl)">도비 12%</div>';
  html += '</div></div>';

  // 비목별
  var bimoks = d.bimok_summary || [];
  if(bimoks.length){
    html += '<div class="card anim" style="animation-delay:.4s">';
    html += '<div class="card-title">비목별 예산 집행</div>';
    html += '<div class="bimok-grid">';
    for(var i=0;i<bimoks.length;i++){
      var b = bimoks[i];
      var c = BIMOK_COLORS[i % BIMOK_COLORS.length];
      var bRate = b['집행률'] || 0;
      html += '<div class="bimok-card" style="border-color:'+c+'">';
      html += '<div class="bimok-name" style="color:'+c+'">'+b['비목']+'</div>';
      html += '<div class="bimok-row"><span>예산</span><span>'+eok(b['예산'])+'억</span></div>';
      html += '<div class="bimok-row"><span>집행</span><span>'+eok(b['집행'])+'억</span></div>';
      html += '<div class="bimok-row"><span>집행률</span><span>'+bRate+'%</span></div>';
      html += '<div class="bimok-bar"><div class="bimok-bar-fill" style="width:'+Math.min(bRate,100)+'%;background:'+c+'"></div></div>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  // 세부 항목 테이블
  var items = d.items || [];
  if(items.length){
    html += '<div class="card anim" style="animation-delay:.45s">';
    html += '<div class="card-title">세부 항목별 집행 내역 <span style="font-size:12px;color:var(--mt);font-weight:400">' + items.length + '개 항목</span></div>';
    html += '<div style="overflow-x:auto"><table class="tbl"><thead><tr>';
    html += '<th>항목명</th><th>비목</th><th class="num">총예산(억)</th><th class="num">집행액(억)</th><th class="num">집행률</th><th>상태</th>';
    html += '</tr></thead><tbody>';
    items.sort(function(a,b){ return (b['총예산']||0) - (a['총예산']||0); });
    for(var j=0;j<items.length;j++){
      var it = items[j];
      var iRate = it['집행률'] || 0;
      var iRateStr = iRate >= 1 ? (iRate*100).toFixed(1) : (iRate*100).toFixed(1);
      if(iRate > 100) iRateStr = iRate.toFixed(1);
      html += '<tr>';
      html += '<td>'+it['항목명']+'</td>';
      html += '<td style="font-size:12px;color:var(--mt)">'+it['비목']+'</td>';
      html += '<td class="num">'+eok(it['총예산'])+'</td>';
      html += '<td class="num">'+eok(it['집행액'])+'</td>';
      html += '<td class="num">'+iRateStr+'%</td>';
      html += '<td><span class="status '+statusClass(it['상태'])+'">'+it['상태']+'</span></td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }

  // 리스크
  var risks = [];
  for(var r=0;r<items.length;r++){
    var ri = items[r];
    var riRate = ri['집행률'] || 0;
    if(riRate >= 1) riRate = riRate * 100;
    else riRate = riRate * 100;
    if(riRate > 100) risks.push({name:ri['항목명'],type:'초과집행',rate:riRate.toFixed(1)+'%'});
    else if(ri['잔액'] < 0) risks.push({name:ri['항목명'],type:'잔액부족',rate:eok(ri['잔액'])+'억'});
  }
  if(risks.length){
    html += '<div class="card anim" style="animation-delay:.5s">';
    html += '<div class="card-title" style="color:var(--rd)">리스크 현황 <span style="font-size:12px;color:var(--mt);font-weight:400">'+risks.length+'건</span></div>';
    for(var k=0;k<Math.min(risks.length,10);k++){
      html += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px">';
      html += '<span class="status st-over">'+risks[k].type+'</span> ';
      html += risks[k].name + ' <span style="font-family:var(--mono);color:var(--rd)">' + risks[k].rate + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  // 링크
  html += '<div class="card anim" style="animation-delay:.55s">';
  html += '<div class="card-title">관련 링크</div>';
  html += '<div class="links">';
  html += '<a href="https://www.notion.so/54bfedc3769e43e8bdbcd59f22008417" target="_blank">💰 예산 집행 현황 DB</a>';
  html += '<a href="https://www.notion.so/efc3526e6e7845d6a48e4ea61021340e" target="_blank">📊 단위사업별 예산관리</a>';
  html += '<a href="https://leesungho-ai.github.io/Asan-Smartcity-WBS/" target="_blank">📋 WBS 대시보드</a>';
  html += '<a href="https://leesungho-ai.github.io/Asan-Smartcity-integration-Portal/" target="_blank">🌐 통합 포털</a>';
  html += '<a href="https://w1708655571-zh1402725.slack.com/archives/C0836U9HVU1" target="_blank">💬 #플랜예산 채널</a>';
  html += '<a href="https://github.com/LEESUNGHO-AI/Asan-Smart-City-Budget-Management-System-BMS-/actions" target="_blank">⚙️ GitHub Actions</a>';
  html += '</div></div>';

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').insertAdjacentHTML('beforeend', html);
  document.getElementById('footer-time').textContent = '마지막 업데이트: ' + d.updated_at;
}

function tryLoad(urls, i){
  if(i >= urls.length){
    document.querySelector('.spinner').style.display = 'none';
    document.querySelector('.load-txt').innerHTML =
      '데이터를 불러올 수 없습니다.<br><br>' +
      '<a href="https://github.com/LEESUNGHO-AI/Asan-Smart-City-Budget-Management-System-BMS-/actions" target="_blank" style="color:var(--ac2)">GitHub Actions</a>를 확인하거나 workflow_dispatch로 수동 실행하세요.';
    return;
  }
  fetch(urls[i] + '?_=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d.summary || d.summary['총집행액'] === undefined) throw new Error('구조 불일치');
      render(d);
    })
    .catch(function(err){
      console.warn('[BMS]', urls[i], '실패:', err.message);
      tryLoad(urls, i+1);
    });
}

tryLoad(['data.json','data/budget.json'], 0);

setTimeout(function(){ location.reload(); }, 30*60*1000);
</script>
</body>
</html>
